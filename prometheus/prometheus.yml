global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "gateway"
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080"]
        labels:
          service: gateway

  - job_name: "auth-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-service:8081"]
        labels:
          service: auth-service

  - job_name: "user-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["user-service:8082"]
        labels:
          service: user-service
