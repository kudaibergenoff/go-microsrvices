apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Values.namespace }}
  labels:
    app: gateway
    {{- include "microservices.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.services.gateway.replicas }}
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: {{ include "microservices.image" (dict "global" .Values.global "image" .Values.services.gateway.image "tag" .Values.services.gateway.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.services.gateway.port }}
          envFrom:
            - configMapRef:
                name: services-config
          env:
            - name: APP_PORT
              value: {{ .Values.services.gateway.port | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.services.gateway.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.services.gateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: gateway
  ports:
    - port: {{ .Values.services.gateway.port }}
{{- if .Values.services.gateway.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-hpa
  namespace: {{ .Values.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: {{ .Values.services.gateway.hpa.minReplicas }}
  maxReplicas: {{ .Values.services.gateway.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.services.gateway.hpa.targetCPU }}
{{- end }}
