apiVersion: v1
kind: Secret
metadata:
  name: db-secrets
  namespace: microservices
type: Opaque
stringData:
  AUTH_DB_USER: auth_user
  AUTH_DB_PASSWORD: auth_password
  AUTH_DB_NAME: auth_db
  USER_DB_USER: user_user
  USER_DB_PASSWORD: user_password
  USER_DB_NAME: user_db
  PRODUCT_DB_USER: product_user
  PRODUCT_DB_PASSWORD: product_password
  PRODUCT_DB_NAME: product_db
  ORDER_DB_USER: order_user
  ORDER_DB_PASSWORD: order_password
  ORDER_DB_NAME: order_db
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secrets
  namespace: microservices
type: Opaque
stringData:
  KEYCLOAK_ADMIN: admin
  KEYCLOAK_ADMIN_PASSWORD: admin
  KC_DB_USERNAME: keycloak
  KC_DB_PASSWORD: keycloak
  KEYCLOAK_CLIENT_ID: microservices-app
  KEYCLOAK_CLIENT_SECRET: change-me-in-production
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-secrets
  namespace: microservices
type: Opaque
stringData:
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin
